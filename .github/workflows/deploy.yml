name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dagster image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile_dagster
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/dagster:latest
            ghcr.io/${{ env.REPO_LOWER }}/dagster:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/dagster:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/dagster:buildcache,mode=max

      - name: Build and push user code image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile_user_code
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/user-code:latest
            ghcr.io/${{ env.REPO_LOWER }}/user-code:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/user-code:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/user-code:buildcache,mode=max

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Write SA key to temp file
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/dagster-sa-key.json

      - name: Write image tag file
        run: echo "IMAGE_TAG=sha-${{ github.event.workflow_run.head_sha }}" > /tmp/.env.deploy

      - name: Copy files to VM
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/deploy/docker-compose.yml.new
          scp -i ~/.ssh/deploy_key \
            /tmp/dagster-sa-key.json \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/deploy/dagster-sa-key.json.new
          scp -i ~/.ssh/deploy_key \
            /tmp/.env.deploy \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/deploy/.env.deploy.new
          scp -i ~/.ssh/deploy_key \
            terraform/deploy.sh \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/deploy/deploy.sh.new

      - name: Trigger deploy
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.DEPLOY_HOST }} \
            'chmod 0755 /opt/deploy/deploy.sh.new && \
            mv /opt/deploy/deploy.sh.new /opt/deploy/deploy.sh && \
            /opt/deploy/deploy.sh'
