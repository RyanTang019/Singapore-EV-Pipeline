name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uv run --group dev ruff check src tests

      # Simplify once first staging models are built
      - name: SQL Lint
        run: |
          if find transform/models -name "*.sql" | grep -q .; then
            uv run --group dev sqlfluff lint transform/models
          else
            echo "No SQL models yet — skipping SQLFluff"
          fi

      - name: Run pytest
        run: uv run --group dev pytest

  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dagster image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile_dagster
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/dagster:latest
            ghcr.io/${{ env.REPO_LOWER }}/dagster:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/dagster:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/dagster:buildcache,mode=max

      - name: Build and push user code image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile_user_code
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/user-code:latest
            ghcr.io/${{ env.REPO_LOWER }}/user-code:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/user-code:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/user-code:buildcache,mode=max

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts       #grabs the current SSH host key and adds it to list of known hosts

      - name: Write SA key to temp file
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/dagster-sa-key.json

      - name: Write image tag file
        run: echo "IMAGE_TAG=sha-${{ github.sha }}" > /tmp/.env.deploy

      - name: Copy files to VM
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/deploy/docker-compose.yml.new
          scp -i ~/.ssh/deploy_key \
            /tmp/dagster-sa-key.json \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/deploy/dagster-sa-key.json.new
          scp -i ~/.ssh/deploy_key \
            /tmp/.env.deploy \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/deploy/.env.deploy.new

      - name: Trigger deploy
        run: ssh -i ~/.ssh/deploy_key deploy@${{ secrets.DEPLOY_HOST }} /opt/deploy/deploy.sh
