name: Terraform (Prod)

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/prod/**
  push:
    branches: [main]
    paths:
      - terraform/prod/**

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  # Public pull requests receive syntax and provider-schema validation only.
  # This job must remain free of OIDC and repository secrets.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format
        working-directory: terraform/prod
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        working-directory: terraform/prod
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/prod
        run: terraform validate

  plan:
    name: Plan
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_TF_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}

      - name: Terraform Init
        working-directory: terraform/prod
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/prod
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/prod/tfplan
          retention-days: 1

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_TF_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}

      - name: Terraform Init
        working-directory: terraform/prod
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/prod

      - name: Terraform Apply
        working-directory: terraform/prod
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -auto-approve tfplan
