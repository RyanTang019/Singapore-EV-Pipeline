name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uv run --group dev ruff check src tests scripts

      - name: SQL Lint
        run: uv run --group dev sqlfluff lint transform/models transform/macros transform/tests

      - name: Build dbt manifest
        env:
          # @dbt_assets reads transform/target/manifest.json at defs-load time, so
          # load_from_defs_folder (and the registration tests) need it pre-built.
          # dbt renders profiles.yml/sources.yml via env_var() at parse time, but
          # `dbt parse` does NOT connect to BigQuery; dummy values suffice.
          GCP_PROJECT_ID: dummy-project
          GCP_REGION: asia-southeast1
          DEV_SCHEMA_PREFIX: dummy_dev
          BQ_DATASET_RAW: dummy_raw
        run: uv run --group dev dbt parse --project-dir transform --profiles-dir transform

      - id: auth
        name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: sg-pipeline-dev
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - name: Create isolated CI datasets
        env:
          GCP_PROJECT_ID: sg-pipeline-dev
          GCP_REGION: asia-southeast1
          DBT_CI_SCHEMA: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: >-
          uv run --group dev python -c
          'import os;
          from google.cloud import bigquery;
          client = bigquery.Client(project=os.environ["GCP_PROJECT_ID"]);
          base = os.environ["DBT_CI_SCHEMA"];
          region = os.environ["GCP_REGION"];
          [(setattr(dataset := bigquery.Dataset(f"{client.project}.{base}{suffix}"), "location", region),
          client.create_dataset(dataset, exists_ok=True))
          for suffix in ("", "_staging", "_intermediate", "_marts", "_seed")]'

      - name: Run dbt unit tests
        env:
          GCP_PROJECT_ID: sg-pipeline-dev
          GCP_REGION: asia-southeast1
          BQ_DATASET_RAW: unused_ci_raw
          DBT_CI_SCHEMA: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: >-
          uv run --group dev dbt test --select "resource_type:unit_test"
          --project-dir transform --profiles-dir transform --target ci

      - name: Run pytest
        run: uv run --group dev pytest

      - name: Drop CI datasets
        if: ${{ always() && steps.auth.outcome == 'success' }}
        continue-on-error: true
        env:
          GCP_PROJECT_ID: sg-pipeline-dev
          DBT_CI_SCHEMA: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: >-
          uv run --group dev python -c
          'import os;
          from google.cloud import bigquery;
          client = bigquery.Client(project=os.environ["GCP_PROJECT_ID"]);
          base = os.environ["DBT_CI_SCHEMA"];
          [client.delete_dataset(f"{client.project}.{base}{suffix}", delete_contents=True, not_found_ok=True)
          for suffix in ("", "_staging", "_intermediate", "_marts", "_seed")]'
