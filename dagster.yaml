run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    env_vars:
      - DAGSTER_POSTGRES_USER
      - DAGSTER_POSTGRES_PASSWORD
      - DAGSTER_POSTGRES_DB
      - DAGSTER_POSTGRES_HOST
      - GOOGLE_APPLICATION_CREDENTIALS
      - GCP_PROJECT_ID
      - GCP_REGION
      - BQ_DATASET_RAW
      - LTA_API_KEY
      - DBT_TARGET
    network: ev_pipeline_network
    container_kwargs:
      volumes:
        - /opt/dagster/dagster-sa-key.json:/opt/dagster/app/dagster-sa-key.json

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # 4GB VM runs one job at a time; without this max_concurrent_runs defaults
    # to 10, which would dequeue the 6-hourly dbt build alongside ingestion.
    max_concurrent_runs: 1

storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

