[project]
name = "singapore-ev-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster==1.13.5",
    "dagster-dg-cli",
    "dagster-docker>=0.29.5",
    "dagster-gcp>=0.29.5",
    "dagster-postgres>=0.29.5",
    "dagster-webserver",
    "dbt-bigquery",
    "google-cloud-bigquery>=3.41.0",
    "pandas>=2.3.3",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["orchestrate*"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestrate"
registry_modules = [
    "orchestrate.components.*",
]
