        from steady_months
        union all
        select
            date '2026-01-31', 'goods_and_other_vehicles', 'complete', 1, 1,
            100, 0, 0, 0, 100, 0,
            0.0, 0.0, 0.0,
            0, null, 0, null,
            0, null, 0, null,
            0, null, 0, null,
            0, 0, 0,
            0, 0, 0,
            0, 0, 0
        union all
        select
            date '2025-01-31', 'buses', 'complete', 1, 1,
            60, 0, 0, 0, 60, 10,
            0.0, 0.0, 0.0,
            null, null, null, null,
            null, null, null, null,
            null, null, null, null,
            0, 0, 0,
            null, null, null,
            null, null, null
        union all
        select
            month_end, 'buses', 'complete', 1, 1,
            60, 0, 0, 0, 60, 10,
            0.0, 0.0, 0.0,
            0, null, null, null,
            0, null, null, null,
