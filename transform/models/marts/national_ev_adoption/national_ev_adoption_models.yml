            null, null, null, null,
            null, null, null, null,
            null, null, null, null,
            0, 0, 0,
            null, null, null,
            null, null, null
        union all
        select
            month_end, 'motorcycles', 'complete', 1, 1,
            72, 0, 0, 0, 72, 0,
            0.0, 0.0, 0.0,
            0, null, null, null,
            0, null, null, null,
            0, null, null, null,
            0, 0, 0,
            0, 0, 0,
            null, null, null
        from steady_months
        union all
        select
            date '2026-01-31', 'motorcycles', 'complete', 1, 1,
            72, 0, 0, 0, 72, 0,
            0.0, 0.0, 0.0,
            0, null, 0, null,
            0, null, 0, null,
            0, null, 0, null,
            0, 0, 0,
            0, 0, 0,
            0, 0, 0
        union all
        select
            date '2025-01-31', 'goods_and_other_vehicles', 'complete', 1, 1,
            100, 0, 0, 0, 100, 0,
            0.0, 0.0, 0.0,
            null, null, null, null,
            null, null, null, null,
            null, null, null, null,
            0, 0, 0,
            null, null, null,
            null, null, null
        union all
        select
            month_end, 'goods_and_other_vehicles', 'complete', 1, 1,
            100, 0, 0, 0, 100, 0,
            0.0, 0.0, 0.0,
            0, null, null, null,
            0, null, null, null,
