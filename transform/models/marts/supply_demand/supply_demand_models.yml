    label: Where Is Charging Supply Falling Behind Residential Demand?
    type: dashboard
    maturity: medium
    description: >
      Looker Studio planning-area page for the latest fully scored residential demand and observed
      accessible charging-supply mismatch. A stable report URL has not yet been assigned.
    depends_on:
      - ref('rpt_supply_demand_gap_current')
    owner:
      name: Ryan Tang
