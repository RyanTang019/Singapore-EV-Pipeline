version: 2

models:
  - name: fct_carpark_availability
    description: >
      One row per carpark per lot type per snapshot (deduped last-observed). Measure available_lots;
      tagged to planning_area with time features. Grain (batch_id, carpark_id, lot_type).
    columns:
      - name: carpark_availability_key
        description: "Surrogate key MD5(batch_id|carpark_id|lot_type). Proves the grain."
        tests:
          - unique
          - not_null
      - name: batch_id
        tests: [not_null]
      - name: carpark_id
        tests: [not_null]
      - name: lot_type
        tests: [not_null]
      - name: available_lots
        description: "Available lots for this carpark+lot type (no total capacity in feed)."
        tests: [not_null]
      - name: planning_area
        description: "URA planning area containing the carpark; NULL if outside all areas."
        tests:
          - relationships:
              arguments:
                to: ref('dim_planning_area')
                field: planning_area
              config:
                where: "planning_area is not null"

  - name: fct_ev_location_availability
    description: >
      One row per location (postal_code) per snapshot (batch_id). Connector counts and
      availability_rate, aggregated up from stg_ev_charger_availability. snapshot_time is the
      chart time axis; grain key is (batch_id, postal_code). Operator excluded (point-level,
      multi-valued per location) — deferred to a future operator-grain mart.
    columns:
      - name: location_availability_key
        description: "Surrogate key = MD5(batch_id|postal_code). Proves the grain is unique."
        tests:
          - unique
          - not_null
      - name: postal_code
        description: "Location natural key (verified 1:1 with site in EVCBatch)."
        tests:
          - not_null
      - name: batch_id
        description: "Dagster run_id of the ingesting run — the grain's ingestion event."
        tests:
          - not_null
      - name: snapshot_time
        description: "True snapshot time from payload.LastUpdatedTime; the dashboard time axis."
        tests:
          - not_null
      - name: total_connectors
        description: "Connectors at this location in this snapshot (COUNT(*))."
      - name: availability_rate
        description: "available_connectors / total_connectors (SAFE_DIVIDE). Range checked by singular test."
      - name: planning_area
        description: "URA planning area containing the location; NULL if outside all areas."
        tests:
          - relationships:
              arguments:
                to: ref('dim_planning_area')
                field: planning_area
              config:
                where: "planning_area is not null"
